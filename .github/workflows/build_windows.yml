name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- 关键修改：去掉了 --onefile ---
    - name: Build with PyInstaller (Directory Mode)
      run: |
        pyinstaller --noconsole --name=MeetingCheckIn --collect-all insightface --collect-all onnxruntime main.py

    # 由于不再是单个 exe，我们需要把整个生成的文件夹打个 zip 包上传
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeetingSystem_Windows_Release
        # 文件夹模式下，所有东西都在 dist/MeetingCheckIn 目录下
        path: dist/MeetingCheckIn/
