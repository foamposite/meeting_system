name: Build Windows EXE (Extreme Fast Startup)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- 🌟 核心提速魔法区域 🌟 ---
    - name: Build with PyInstaller (Optimized Directory Mode)
      run: |
        python -OO -m PyInstaller --noupx --noconsole --name=MeetingCheckIn --exclude-module torch --exclude-module matplotlib --exclude-module scipy --exclude-module PyQt5 --exclude-module PySide2 --collect-all insightface --collect-all onnxruntime main.py

    # 提取生成的优化版文件夹
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeetingSystem_Windows_Release_Optimized
        path: dist/MeetingCheckIn/
