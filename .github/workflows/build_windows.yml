name: Build Windows EXE

# 触发条件：当推送到 main 分支时自动运行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在网页上有一个按钮手动点击触发

jobs:
  build:
    runs-on: windows-latest  # 关键：指定使用 Windows Server 环境

    steps:
    # 1. 拉取你的代码
    - uses: actions/checkout@v3

    # 2. 安装 Python 3.9
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 3. 安装依赖库
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 执行 PyInstaller 打包
    # 注意：--collect-all 是为了强制收集 insightface 和 onnxruntime 的所有隐式依赖
    # 否则运行 exe 时可能会报 "Module not found"
    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --name=MeetingCheckIn --collect-all insightface --collect-all onnxruntime main.py

    # 5. 上传打包结果 (将生成的 exe 保存下来供你下载)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeetingSystem_Windows_EXE
        path: dist/MeetingCheckIn.exe
