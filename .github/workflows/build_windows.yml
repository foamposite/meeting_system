name: Build Windows EXE (Final Stable & Fast)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- 最终构建命令 ---
    # 1. --noconsole: 隐藏黑色命令行窗口 (注意：main.py 必须有 NullWriter 类防止崩溃)
    # 2. --noupx: 不使用 UPX 压缩，牺牲体积换取最快的启动速度
    # 3. --collect-all: 强制把 insightface 和 onnxruntime 的所有依赖都带上，防止报错
    # 4. 移除了所有 --exclude-module: 确保 scipy/sklearn 等库完整保留，保证稳定性
    - name: Build with PyInstaller (Directory Mode)
      run: |
        pyinstaller --noconsole --noupx --name=MeetingCheckIn --collect-all insightface --collect-all onnxruntime main.py

    # --- 上传产物 ---
    # 上传整个 dist/MeetingCheckIn 文件夹作为 ZIP 包
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeetingSystem_Windows_Final
        path: dist/MeetingCheckIn/
